name: REDLINE browser playthrough
on:
  push:
    branches:
      - improvement/redline-showdown
  workflow_dispatch:
concurrency:
  group: redline-browser-upgrade
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use preinstalled Google Chrome with Playwright
        run: |
          npm install --no-save playwright
          command -v google-chrome || command -v google-chrome-stable
          google-chrome --version || google-chrome-stable --version
      - name: Test complete offline escape sequence in Chrome
        shell: bash
        run: |
          export REDLINE_PLAYWRIGHT=playwright
          export REDLINE_CHROME="$(command -v google-chrome || command -v google-chrome-stable)"
          test -n "$REDLINE_CHROME"
          node tests/contracts-browser.cjs --shots
          node tests/browser.cjs --shots
          node tests/west-browser.cjs --one
      - name: Save authentic browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redline-browser-captures
          path: screenshots/
          if-no-files-found: ignore
      - name: Publish only verified, actual-play screenshots
        if: success()
        shell: bash
        run: |
          node -e "const fs=require('fs');for(const f of ['01-chase.jpg','02-start.jpg','03-risk.jpg','04-results.jpg']){const s=fs.statSync('screenshots/'+f).size;if(s>256*1024||s<1000)throw Error(f+' invalid size '+s)}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/01-chase.jpg screenshots/02-start.jpg screenshots/03-risk.jpg screenshots/04-results.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Capture current verified REDLINE gameplay [skip ci]"
            git push origin HEAD:improvement/redline-showdown
          fi
