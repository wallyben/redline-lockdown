name: REDLINE browser playthrough
on:
  push:
    branches:
      - improvement/lockdown-96-chat
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test complete offline escape sequence in Chromium
        shell: bash
        run: |
          export REDLINE_PLAYWRIGHT=playwright
          export REDLINE_CHROME=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          node tests/browser.cjs --shots
      - name: Save authentic browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redline-browser-captures
          path: screenshots/
          if-no-files-found: ignore
