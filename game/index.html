<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REDLINE: LOCKDOWN</title>
<link rel="stylesheet" href="style.css">
<script defer src="src/city.js"></script>
<script defer src="src/traffic.js"></script>
<script defer src="src/drive.js"></script>
<script defer src="src/pursuit.js"></script>
<script defer src="src/art.js"></script>

<body>
<canvas aria-label="Top-down view of the city"></canvas>
<section id="brief">
<h1>REDLINE <span>LOCKDOWN</span></h1>
<p>Rob the Port Meridian bank, evade police, then reach the docks.</p>
<div class="actions"><button id="start">Drive ↵</button><label id="patrol-choice">Contract <select id="patrol"></select></label></div>
<small>W / ↑ accelerate · A / ← and D / → steer · S / ↓ brake · Space handbrake · E interact · Shift near a relay closes its gate · Esc pause · R retry · C contracts</small>
</section>
<div id="hud" hidden></div>
<div id="settings"><button id="mute">Sound on</button><button id="flash">Full lights</button></div></body>
</html>
